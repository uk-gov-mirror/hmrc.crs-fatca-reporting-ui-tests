environment: local

local {
  services {
    host: "http://localhost"
    auth-login-stub {
      port: 9949
      productionRoute: "/auth-login-stub"
    }
    crs-fatca-reporting-frontend {
      port = 10038
      productionRoute = "/report-for-crs-and-fatca"
    }
    crs-fatca-financial-institutions {
      port = 10033
      productionRoute = "/manage-your-crs-and-fatca-financial-institutions"
    }
    crs-fatca-manual-submission-frontend {
      port = 10039
      productionRoute = "/crs-fatca-manual-submission-frontend"
    }
  }
  enrolment {
    key = "HMRC-FATCA-ORG"
    identifier = "FATCAID"
    individualId = "1119234567"
    organisationId = "2009234567"
    autoMatchedUserId = "3009234567"
  }
}

dev {
  services {
    host: "https://www.development.tax.service.gov.uk"
  }
}

qa {
  services {
    host: "https://www.qa.tax.service.gov.uk"
  }
}

staging {
  services {
    host: "https://www.staging.tax.service.gov.uk"
  }
}
